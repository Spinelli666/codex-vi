# Postgres para desenvolvimento local. Em produção o blog usa o Postgres da VPS.
services:
  postgres:
    image: postgres:17-alpine
    container_name: codex-vi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codex
      POSTGRES_PASSWORD: codex
      POSTGRES_DB: codex_vi
    ports:
      - "5433:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex -d codex_vi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dados-postgres:
